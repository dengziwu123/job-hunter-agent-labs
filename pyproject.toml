[project]
name = "agentic-framework-lab"
version = "0.1.0"
description = "Course code template for the Agentic Framework Lab"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116",
    "google-genai>=1.0",
    "httpx>=0.28",
    "markdown>=3.10.2",
    "mcp>=2.0",
    "pydantic>=2.0",
    "pypdf>=5.0",
    "pytest>=8.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["labs"]
